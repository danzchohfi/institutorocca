<!-- LIGHTBOX (dialog nativo): um só para o site inteiro. Abre com qualquer [data-abre-lightbox="#filme"]
     (ui.js); o stream.js monta o iframe do vídeo do abridor no .stream de modo "alvo" e o remove ao fechar.
     O UID em data-stream aqui é o do filme institucional completo, com som. -->
<dialog class="lightbox" id="filme" aria-labelledby="filme-legenda">
  <button class="lightbox__fechar" type="button" data-fecha-lightbox aria-label="Fechar o filme">Fechar</button>
  <div class="lightbox__media">
    <div class="stream" data-stream="{{stream_institucional}}" data-stream-modo="alvo" data-stream-titulo="Filme institucional · Instituto Rocca">
      <img class="stream__poster" src="{{raiz}}assets/img/producao/recepcao-01.jpg" srcset="{{raiz}}assets/img/producao/recepcao-01-1280.jpg 1280w, {{raiz}}assets/img/producao/recepcao-01.jpg 2400w" sizes="100vw" width="2400" height="1600" loading="lazy" decoding="async" alt="">
      <span class="stream__rotulo">Filme institucional: gravação no instituto</span>
    </div>
  </div>
  <p class="lightbox__legenda" id="filme-legenda" data-stream-legenda>Filme institucional · Instituto Rocca</p>
</dialog>
