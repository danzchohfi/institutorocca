<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo}}</title>
  <meta name="description" content="{{descricao}}">
  {{robots_meta}}
  <meta property="og:title" content="{{og_titulo}}">
  <meta property="og:description" content="{{descricao}}">
  <meta property="og:site_name" content="Instituto Rocca">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="{{raiz}}{{og_imagem}}">
  <!-- Semplicita Pro auto-hospedada via @font-face em brand/tokens.css (sem Google Fonts, sem CDN) -->
  <link rel="stylesheet" href="{{raiz}}brand/tokens.css">
  <link rel="stylesheet" href="{{raiz}}shared/base.css">
  <link rel="stylesheet" href="{{site}}site.css">
  {{css_link}}
  <link rel="icon" href="{{raiz}}assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="{{tema_cor}}">
  <script src="{{site}}{{bundle}}" defer></script>
</head>
