  <section class="hero hero--interno sup-bordo" id="inicio" data-hero>
    <div class="container hero__in">

          <a class="botao botao--secundario" href="{{site}}" aria-label="Voltar para a página inicial">Página inicial <span class="seta" aria-hidden="true">→</span></a>
        </div>
      </div>
      <div class="hero__foto paralaxe" data-parallax-area data-reveal="escala">
        <div class="paralaxe__in" data-parallax="-6">
          <img src="{{raiz}}assets/img/producao/medicos-trio-horizontal.jpg" alt="Dr. Túlio Bovo, Dra. Ana Paula Bovo e Dr. Breno Gondim no estúdio Jacarandá, diante da parede de madeira ripada com luz vermelha." width="1280" height="853" decoding="async">

      </div>
    </div>
