# Publica o site do Instituto Rocca no Cloudflare (Worker só com arquivos estáticos) a cada push na main.
# Em pull request, só monta e confere (a varredura do publicar.mjs falha se algo de bastidor for ao ar).
# Upload direto daqui, com wrangler e um token da conta Cloudflare: o Cloudflare não acessa o repositório.
# Segredos do repositório (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# Sem eles, o workflow monta o site, confere e avisa que não publicou. Passo a passo: docs/cloudflare.md.
name: Publicar no Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Montar o site
        run: |
          node scripts/publicar.mjs
          du -sh _site
      - name: Conferir os segredos
        if: github.event_name != 'pull_request'
        id: segredos
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CONTA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID ainda não configurado: o site foi montado e conferido, mas não publicado."
          fi
      - name: Publicar
        if: steps.segredos.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.144.0 deploy --message "${GITHUB_SHA::7}"
