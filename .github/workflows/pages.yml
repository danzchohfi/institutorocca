# Publica o site do Instituto Rocca no GitHub Pages enquanto o domínio não migra para o Cloudflare
# (docs/cloudflare.md). Depois da troca do domínio, este workflow sai e o GitHub Pages é desativado.
# Sem build: as páginas e os bundles (site/app.js, site/interno.js) já estão versionados.
# scripts/publicar.mjs --github monta _site/ só com o que as páginas usam, sem comentários, e com
# páginas de redirecionamento nos endereços antigos /site/….
name: Publicar no GitHub Pages

on:
  push:
    branches:
      - claude/instituto-rocca-home-concepts-fzadlo
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Montar o site
        run: |
          node scripts/publicar.mjs --github
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
